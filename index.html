<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#7c3aed">
<title>Dr Media Pro - Professional Video Production Management System</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DrMedia">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#7c3aed;
  --primary-dark:#6d28d9;
  --primary-light:#a78bfa;
  --accent:#f59e0b;
  --bg:#f4f5fb;
  --surface:#ffffff;
  --surface-2:#f9fafb;
  --border:#e5e7eb;
  --text:#0f172a;
  --text-muted:#64748b;
  --sidebar-bg:#0f0a1f;
  --sidebar-text:#cbd5e1;
  --sidebar-hover:#1e1b3a;
  --sidebar-active:#7c3aed;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);
  --shadow:0 4px 16px rgba(15,23,42,.06);
  --shadow-lg:0 20px 40px -12px rgba(15,23,42,.15);
}
[data-theme="dark"]{
  --bg:#0a0715;
  --surface:#151024;
  --surface-2:#1c1533;
  --border:#2a2145;
  --text:#f1f5f9;
  --text-muted:#94a3b8;
  --sidebar-bg:#0a0715;
  --sidebar-hover:#1c1533;
  --shadow:0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:'Cairo','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s}
html[dir="ltr"] body{font-family:'Inter','Cairo',system-ui,sans-serif}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
.hidden{display:none!important}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(-20px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* LOGIN */
#login-screen{
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 20%,rgba(124,58,237,.35),transparent 50%),
             radial-gradient(circle at 80% 80%,rgba(245,158,11,.25),transparent 50%),
             linear-gradient(135deg,#0f0a1f 0%,#1e1b3a 100%);
  padding:1rem;position:relative;overflow:hidden;
}
#login-screen::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:32px 32px;opacity:.5}
.login-card{background:rgba(21,16,36,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:2.5rem 2rem;width:100%;max-width:440px;position:relative;z-index:1;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.brand-logo{display:flex;align-items:center;gap:.75rem;justify-content:center;margin-bottom:1.5rem}
.brand-logo .icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.5rem;box-shadow:0 10px 30px -8px var(--primary)}
.brand-logo h1{color:#fff;font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.02em}
.brand-logo h1 span{background:linear-gradient(135deg,var(--primary-light),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.login-card h2{color:#fff;text-align:center;font-size:1.125rem;font-weight:600;margin:0 0 .25rem}
.login-card p.sub{color:#94a3b8;text-align:center;font-size:.85rem;margin:0 0 1.5rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;color:#cbd5e1;font-size:.8rem;font-weight:500;margin-bottom:.4rem}
.input-wrap{position:relative}
.input-wrap i{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:#64748b;width:18px;height:18px;pointer-events:none}
.input-wrap input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:.85rem 1rem;padding-inline-start:44px;color:#fff;font-size:.95rem;font-family:inherit;transition:all .2s}
.input-wrap input:focus{outline:none;border-color:var(--primary);background:rgba(124,58,237,.08);box-shadow:0 0 0 4px rgba(124,58,237,.15)}
.input-wrap input::placeholder{color:#64748b}
.eye-btn{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;padding:4px;display:flex;align-items:center}
.eye-btn:hover{color:#fff}
.login-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;font-size:.85rem}
.login-row label{display:flex;align-items:center;gap:.5rem;color:#cbd5e1;cursor:pointer}
.login-row input[type="checkbox"]{accent-color:var(--primary);width:16px;height:16px}
.login-row a{color:var(--primary-light);text-decoration:none;font-weight:500}
.login-row a:hover{color:#fff}
.btn-login{width:100%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;padding:.95rem;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;box-shadow:0 10px 25px -8px var(--primary)}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 15px 30px -8px var(--primary)}
.btn-login:active{transform:translateY(0)}
.demo-hint{margin-top:1.25rem;padding:.75rem;background:rgba(124,58,237,.1);border:1px dashed rgba(124,58,237,.3);border-radius:10px;color:#c4b5fd;font-size:.75rem;text-align:center;line-height:1.6}
.demo-hint b{color:#fff}

/* APP LAYOUT */
#app{display:flex;min-height:100vh;min-height:100dvh}
aside#sidebar{width:260px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:50;transition:transform .3s ease;overflow:hidden}
[dir="rtl"] aside#sidebar{right:0;left:auto}
.sidebar-brand{padding:1.25rem 1.25rem;display:flex;align-items:center;gap:.75rem;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-brand .icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0}
.sidebar-brand h1{margin:0;color:#fff;font-size:1rem;font-weight:700;line-height:1.2}
.sidebar-brand h1 span{display:block;font-size:.65rem;font-weight:400;color:var(--sidebar-text);opacity:.7;margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto;padding:.75rem;scrollbar-width:thin}
.nav-section{padding:.75rem .75rem .35rem;font-size:.65rem;font-weight:600;color:var(--sidebar-text);opacity:.5;text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.65rem .75rem;border-radius:10px;color:var(--sidebar-text);text-decoration:none;font-size:.875rem;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 8px 20px -8px var(--primary)}
.nav-item i{width:18px;height:18px;flex-shrink:0}
.nav-item .badge{margin-inline-start:auto;background:var(--accent);color:#000;font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:6px;min-width:18px;text-align:center}
.sidebar-footer{padding:1rem;border-top:1px solid rgba(255,255,255,.06)}
.user-chip{display:flex;align-items:center;gap:.6rem;padding:.5rem;border-radius:10px;background:var(--sidebar-hover);cursor:pointer}
.user-chip .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.85rem;flex-shrink:0}
.user-chip .info{overflow:hidden;flex:1}
.user-chip .info .name{color:#fff;font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .info .role{color:var(--sidebar-text);font-size:.7rem;opacity:.7}

main#main{flex:1;margin-inline-start:260px;display:flex;flex-direction:column;min-width:0}
[dir="rtl"] main#main{margin-right:260px;margin-left:0}
header#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:.85rem 1.5rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:30;box-shadow:var(--shadow-sm)}
.menu-btn{display:none;background:none;border:none;color:var(--text);cursor:pointer;padding:6px;border-radius:8px}
.menu-btn:hover{background:var(--surface-2)}
.page-title{font-size:1.05rem;font-weight:700;margin:0;flex:1;display:flex;align-items:center;gap:.5rem;min-width:0}
.page-title .subtitle{font-size:.75rem;font-weight:400;color:var(--text-muted);display:block;margin-top:1px}
.search-box{position:relative;max-width:340px;flex:1}
.search-box i{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);width:16px;height:16px}
.search-box input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:.55rem 1rem;padding-inline-start:38px;color:var(--text);font-size:.85rem;font-family:inherit}
.search-box input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.topbar-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:8px;border-radius:10px;position:relative;display:flex;align-items:center;justify-content:center;transition:background .15s}
.topbar-btn:hover{background:var(--surface-2)}
.topbar-btn .dot{position:absolute;top:6px;inset-inline-end:6px;width:8px;height:8px;background:#ef4444;border-radius:50%;border:2px solid var(--surface)}
#content{padding:1.5rem;flex:1;overflow-x:hidden}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.25rem;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow)}
.stat-card{display:flex;align-items:flex-start;gap:1rem;padding:1.25rem;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:all .2s;position:relative;overflow:hidden}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon i{width:22px;height:22px}
.stat-body{min-width:0;flex:1}
.stat-body .label{font-size:.75rem;color:var(--text-muted);font-weight:500;margin-bottom:.25rem}
.stat-body .value{font-size:1.5rem;font-weight:800;color:var(--text);line-height:1.1}
.stat-body .delta{font-size:.7rem;margin-top:.35rem;display:inline-flex;align-items:center;gap:.25rem;padding:2px 6px;border-radius:6px;font-weight:600}
.delta.up{background:rgba(16,185,129,.1);color:#10b981}
.delta.down{background:rgba(239,68,68,.1);color:#ef4444}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.6rem 1rem;border-radius:10px;border:1px solid transparent;font-size:.85rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 8px 20px -8px var(--primary)}
.btn-ghost{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:#10b981;color:#fff}
.btn-success:hover{background:#059669}
.btn-sm{padding:.4rem .75rem;font-size:.78rem}
.btn-icon{padding:.5rem;width:34px;height:34px}
.btn i{width:16px;height:16px}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--border);background:var(--surface)}
table.data-table{width:100%;border-collapse:collapse;font-size:.85rem}
table.data-table th{background:var(--surface-2);color:var(--text-muted);font-weight:600;text-align:start;padding:.75rem 1rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;border-bottom:1px solid var(--border)}
table.data-table td{padding:.85rem 1rem;border-bottom:1px solid var(--border);vertical-align:middle}
table.data-table tbody tr:last-child td{border-bottom:none}
table.data-table tbody tr:hover{background:var(--surface-2)}
table.data-table tbody tr{transition:background .1s}
.cell-user{display:flex;align-items:center;gap:.6rem;min-width:0}
.cell-user .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}

/* BADGES */
.badge-pill{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .65rem;border-radius:999px;font-size:.7rem;font-weight:600;white-space:nowrap}
.badge-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-green{background:rgba(16,185,129,.12);color:#059669}
.badge-yellow{background:rgba(245,158,11,.12);color:#d97706}
.badge-red{background:rgba(239,68,68,.12);color:#dc2626}
.badge-blue{background:rgba(59,130,246,.12);color:#2563eb}
.badge-purple{background:rgba(124,58,237,.12);color:#7c3aed}
.badge-gray{background:var(--surface-2);color:var(--text-muted)}

/* FORMS */
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.field{display:flex;flex-direction:column;gap:.35rem}
.field label{font-size:.78rem;font-weight:600;color:var(--text)}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:.6rem .8rem;color:var(--text);font-size:.875rem;font-family:inherit;transition:all .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,58,237,.1);background:var(--surface)}
.field textarea{resize:vertical;min-height:80px}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,10,31,.65);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fadeIn .15s}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:fadeIn .2s;border:1px solid var(--border)}
.modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2;border-radius:18px 18px 0 0}
.modal-header h3{margin:0;font-size:1.05rem;font-weight:700}
.modal-body{padding:1.5rem}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;gap:.5rem;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 18px 18px}
.close-x{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;border-radius:8px;display:flex;align-items:center}
.close-x:hover{background:var(--surface-2);color:var(--text)}

/* TOAST */
#toast-container{position:fixed;top:1rem;inset-inline-end:1rem;z-index:200;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid var(--primary);border-radius:12px;padding:.85rem 1rem;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:.6rem;min-width:260px;max-width:400px;font-size:.85rem;pointer-events:auto;animation:slideIn .25s}
.toast.success{border-inline-start-color:#10b981}
.toast.error{border-inline-start-color:#ef4444}
.toast.warn{border-inline-start-color:#f59e0b}
.toast i{width:18px;height:18px;flex-shrink:0}
.toast.success i{color:#10b981}
.toast.error i{color:#ef4444}
.toast.warn i{color:#f59e0b}
.toast.info i{color:var(--primary)}

/* DASHBOARD GRID */
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:1.5rem}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.25rem}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.25rem}
.section-title{font-size:1rem;font-weight:700;margin:1.75rem 0 1rem;display:flex;align-items:center;gap:.5rem}
.section-title i{width:18px;height:18px;color:var(--primary)}

/* CHART */
.chart-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.25rem}
.chart-box h4{margin:0 0 1rem;font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
.chart-box h4 i{width:16px;height:16px;color:var(--primary)}
.chart-canvas-wrap{position:relative;height:260px}

/* HALL REQUIREMENTS */
.req-chip{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .7rem;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;font-size:.75rem;font-weight:500;margin:.15rem}
.req-chip b{color:var(--primary)}

/* DISTRIBUTION BOARD */
.hall-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.25rem;margin-bottom:1rem}
.hall-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:.75rem;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:.5rem}
.hall-header h4{margin:0;font-size:1rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
.role-group{margin-bottom:.85rem}
.role-group .role-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:.4rem;display:flex;align-items:center;gap:.35rem}
.role-group .role-label .cnt{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:.65rem}
.emp-chip{display:inline-flex;align-items:center;gap:.5rem;padding:.45rem .7rem;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;font-size:.8rem;font-weight:500;margin:.2rem;cursor:grab;transition:all .15s}
.emp-chip:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.emp-chip .status-dot{width:8px;height:8px;border-radius:50%}
.emp-chip .status-dot.confirmed{background:#10b981}
.emp-chip .status-dot.pending{background:#f59e0b}
.emp-chip .status-dot.missing{background:#ef4444}
.emp-chip.dragging{opacity:.5;cursor:grabbing}
.dropzone{min-height:50px;border:2px dashed transparent;border-radius:10px;padding:.35rem;transition:all .15s}
.dropzone.dragover{border-color:var(--primary);background:rgba(124,58,237,.05)}
.shortage-warn{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);color:#dc2626;padding:.65rem .85rem;border-radius:10px;font-size:.8rem;margin-top:.5rem;display:flex;align-items:center;gap:.5rem}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{aspect-ratio:1;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);padding:.4rem;font-size:.8rem;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:all .15s;min-height:60px;position:relative}
.cal-day:hover{border-color:var(--primary);background:rgba(124,58,237,.04)}
.cal-day.today{border-color:var(--primary);background:rgba(124,58,237,.1);font-weight:700}
.cal-day.empty{background:transparent;border:none;cursor:default}
.cal-day .num{font-weight:600}
.cal-day .events{display:flex;gap:2px;flex-wrap:wrap}
.cal-day .ev-dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
.cal-day .ev-count{position:absolute;top:4px;inset-inline-end:4px;background:var(--primary);color:#fff;font-size:.6rem;font-weight:700;border-radius:8px;padding:1px 5px;min-width:16px;text-align:center}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.cal-head div{text-align:center;font-size:.7rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;padding:.4rem 0}

/* TABS */
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--border);margin-bottom:1.25rem;overflow-x:auto}
.tab{padding:.6rem 1rem;font-size:.85rem;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* EMPTY */
.empty-state{padding:3rem 1rem;text-align:center;color:var(--text-muted)}
.empty-state i{width:48px;height:48px;margin-bottom:.75rem;opacity:.4}
.empty-state p{margin:0;font-size:.9rem}

/* LOADING SKELETON */
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:pulse 1.5s infinite;border-radius:8px}

/* SWITCH */
.switch{position:relative;display:inline-block;width:42px;height:24px}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--border);border-radius:999px;transition:.3s}
.switch .slider::before{content:'';position:absolute;height:18px;width:18px;inset-inline-start:3px;top:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch input:checked + .slider{background:var(--primary)}
.switch input:checked + .slider::before{transform:translateX(18px)}
[dir="rtl"] .switch input:checked + .slider::before{transform:translateX(-18px)}

/* MOBILE */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49}
@media (max-width:1024px){
  aside#sidebar{transform:translateX(100%)}
  [dir="ltr"] aside#sidebar{transform:translateX(-100%)}
  aside#sidebar.open{transform:translateX(0)}
  main#main{margin-inline-start:0!important}
  [dir="rtl"] main#main{margin-right:0}
  .menu-btn{display:flex}
  .sidebar-overlay.show{display:block}
}
@media (max-width:640px){
  #content{padding:1rem}
  header#topbar{padding:.7rem 1rem;gap:.5rem}
  .search-box{display:none}
  .stat-body .value{font-size:1.25rem}
  .modal{max-width:100%;margin:0;border-radius:16px 16px 0 0;max-height:95vh}
  .modal-backdrop{align-items:flex-end;padding:0}
  .cal-day{min-height:52px;font-size:.7rem}
  .page-title .subtitle{display:none}
  .hide-mobile{display:none!important}
}
@media print{
  aside#sidebar,header#topbar,.no-print{display:none!important}
  main#main{margin:0!important}
  #content{padding:0}
  .card,.table-wrap{box-shadow:none;border:1px solid #ddd}
}

/* ---------- State & Storage ---------- */
const State = {
  data: null,
  user: null,
  page: 'dashboard',
  lang: localStorage.getItem(LANG_KEY) || 'ar',
  theme: localStorage.getItem(THEME_KEY) || 'light',
  charts: {},
  filters: {}
};

function loadData(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  } catch(e){ console.warn('Load failed', e); }
  const seeded = seedData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
  return seeded;
}
function saveData(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(State.data)); }
  catch(e){ console.warn('Save failed', e); }
}

/* ---------- Utilities ---------- */
const $ = (s,el=document) => el.querySelector(s);
const $$ = (s,el=document) => [...el.querySelectorAll(s)];
const uid = (p='id') => p+'_'+Math.random().toString(36).slice(2,9);
const fmtDate = d => { if(!d) return '-'; const dt = new Date(d); return dt.toLocaleDateString(State.lang==='ar'?'ar-EG':'en-GB'); };
const fmtDateLong = d => { if(!d) return '-'; const dt = new Date(d); return dt.toLocaleDateString(State.lang==='ar'?'ar-EG':'en-GB',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); };
const todayISO = () => new Date().toISOString().slice(0,10);
const addDaysISO = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const initials = name => (name||'?').trim().split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase();

function showToast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast '+type;
  const icon = {success:'check-circle',error:'x-circle',warn:'alert-triangle',info:'info'}[type] || 'info';
  el.innerHTML = `<i data-lucide="${icon}"></i><span>${msg}</span>`;
  $('#toast-container').appendChild(el);
  lucide.createIcons();
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),250); }, 3200);
}

function logActivity(action, entity, entityId, oldVal, newVal){
  State.data.activityLogs.unshift({
    id: uid('log'), userId: State.user?.id, userName: State.user?.name,
    action, entity, entityId, oldVal, newVal,
    date: new Date().toISOString()
  });
  if(State.data.activityLogs.length > 500) State.data.activityLogs.length = 500;
  saveData();
}

function can(module, perm='view'){
  if(!State.user) return false;
  if(State.user.role === 'Admin') return true;
  const roleDef = State.data.roles.find(r => r.name === State.user.role);
  if(!roleDef) return false;
  if(roleDef.permissions['*']) return true;
  if(module === 'self') return roleDef.permissions.self?.includes('view');
  const perms = roleDef.permissions[module];
  return perms && perms.includes(perm);
}

function applyLang(){
  const html = document.documentElement;
  html.lang = State.lang;
  html.dir = State.lang === 'ar' ? 'rtl' : 'ltr';
  $$('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    el.textContent = t(k);
  });
  $$('[data-i18n-placeholder]').forEach(el => {
    el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder')));
  });
  const lt = $('#lang-btn');
  if(lt) lt.title = State.lang === 'ar' ? 'English' : 'العربية';
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', State.theme);
  const btn = $('#theme-btn');
  if(btn){
    btn.innerHTML = `<i data-lucide="${State.theme==='dark'?'sun':'moon'}"></i>`;
    lucide.createIcons();
  }
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', State.theme==='dark' ? '#0a0715' : '#7c3aed');
}

/* ---------- Authentication ---------- */
function attemptLogin(username, password){
  const u = State.data.users.find(x => (x.username === username) && x.password === password);
  if(!u) return false;
  State.user = { id:u.id, username:u.username, name:u.name, role:u.role, employeeId:u.employeeId };
  localStorage.setItem(SESSION_KEY, JSON.stringify(State.user));
  return true;
}
function restoreSession(){
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if(raw){
      const u = JSON.parse(raw);
      if(State.data.users.find(x => x.id === u.id)){ State.user = u; return true; }
    }
  } catch(e){}
  return false;
}
function logout(){
  localStorage.removeItem(SESSION_KEY);
  State.user = null;
  $('#app').classList.add('hidden');
  $('#login-screen').classList.remove('hidden');
}

function renderSidebar(){
  const nav = $('#sidebar-nav');
  nav.innerHTML = '';
  const unread = State.data.notifications.filter(n => !n.read).length;
  NAV_ITEMS.forEach(group => {
    const section = document.createElement('div');
    section.className = 'nav-section';
    section.textContent = t(group.section);
    nav.appendChild(section);
    group.items.forEach(item => {
      if(!can(item.id)) return;
      const a = document.createElement('a');
      a.className = 'nav-item' + (State.page===item.id ? ' active' : '');
      a.dataset.page = item.id;
      a.innerHTML = `<i data-lucide="${item.icon}"></i><span>${t(item.label)}</span>`;
      if(item.id==='notifications' && unread>0){
        a.innerHTML += `<span class="badge">${unread}</span>`;
      }
      a.onclick = (e) => { e.preventDefault(); navigate(item.id); closeSidebar(); };
      nav.appendChild(a);
    });
  });
  // notifications at bottom of main section (add manually if not present)
  lucide.createIcons();
}

function navigate(page){
  if(!can(page)){
    showToast('Unauthorized', 'error');
    return;
  }
  State.page = page;
  renderSidebar();
  const item = NAV_ITEMS.flatMap(g=>g.items).find(i=>i.id===page);
  $('#page-title-text').textContent = item ? t(item.label) : page;
  $('#page-subtitle').textContent = '';
  const container = $('#content');
  container.innerHTML = '<div class="skeleton" style="height:60px;margin-bottom:1rem"></div><div class="skeleton" style="height:200px"></div>';
  setTimeout(() => {
    const renderer = Pages[page];
    if(renderer) renderer(container);
    else container.innerHTML = '<div class="empty-state"><i data-lucide="construction"></i><p>Page under construction</p></div>';
    lucide.createIcons();
    attachGlobalHandlers();
  }, 100);
}

function closeSidebar(){
  $('#sidebar').classList.remove('open');
  $('#sidebar-overlay').classList.remove('show');
}
function openSidebar(){
  $('#sidebar').classList.add('open');
  $('#sidebar-overlay').classList.add('show');
}

/* ---------- Modal ---------- */
function openModal({title, body, footer, size='md'}){
  const root = $('#modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:${size==='lg'?'900px':size==='xl'?'1100px':size==='sm'?'380px':'560px'}">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="close-x" onclick="closeModal()"><i data-lucide="x"></i></button>
        </div>
        <div class="modal-body">${body}</div>
        ${footer ? `<div class="modal-footer">${footer}</div>` : ''}
      </div>
    </div>`;
  lucide.createIcons();
}
function closeModal(){ $('#modal-root').innerHTML = ''; }

function confirmDialog(msg, onYes){
  openModal({
    title: t('confirm'),
    size: 'sm',
    body:`<p style="margin:0;font-size:.9rem">${msg}</p>`,
    footer:`
      <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn btn-danger" id="confirm-yes">${t('confirm')}</button>`
  });
  $('#confirm-yes').onclick = () => { closeModal(); onYes(); };
}

/* ---------- Charts helper ---------- */
function destroyCharts(){
  Object.values(State.charts).forEach(c => { try{ c.destroy(); }catch(e){} });
  State.charts = {};
}
function makeChart(id, config){
  if(State.charts[id]) try{ State.charts[id].destroy(); }catch(e){}
  const ctx = document.getElementById(id);
  if(!ctx) return;
  const isDark = State.theme === 'dark';
  Chart.defaults.color = isDark ? '#94a3b8' : '#64748b';
  Chart.defaults.borderColor = isDark ? '#2a2145' : '#e5e7eb';
  Chart.defaults.font.family = State.lang === 'ar' ? 'Cairo, sans-serif' : 'Inter, sans-serif';
  State.charts[id] = new Chart(ctx, config);
}

Pages.dashboard = function(el){

  const monthPrefix = today.slice(0,7);
  const monthBookings = d.bookings.filter(b => b.date.startsWith(monthPrefix));
  const hallsBusy = new Set(todayBookings.map(b => b.hallId)).size;
  const workingToday = new Set((d.distributions||[]).filter(x => x.date === today).map(x => x.employeeId));
  const onLeave = (d.leaves||[]).filter(l => l.status === 'approved' && l.date === today).length;
  const absent = (d.attendance||[]).filter(a => a.date === today && a.status === 'absent').length;

  const totalAdvances = (d.advances||[]).reduce((s,a) => s + (a.remaining || 0), 0);
  const totalDeductions = (d.deductions||[]).reduce((s,x) => s + (x.amount||0), 0);
  const totalBonus = (d.bonuses||[]).reduce((s,x) => s + (x.amount||0), 0);
  const totalPayroll = d.employees.reduce((s,e) => {
    const workDays = (d.distributions||[]).filter(x => x.employeeId === e.id && x.status === 'confirmed').length;
    return s + workDays * (e.dayRate || 0);
  }, 0);
  const netPayroll = totalPayroll + totalBonus - totalAdvances - totalDeductions;

  const stat = (icon, color, label, value, delta) => `
    <div class="stat-card">
      <div class="stat-icon" style="background:${color}20;color:${color}"><i data-lucide="${icon}"></i></div>
      <div class="stat-body">
        <div class="label">${label}</div>
        <div class="value">${value}</div>

  el.innerHTML = `

      ${stat('user-x', '#64748b', t('absent'), absent)}

      ${stat('wallet', '#7c3aed', t('total_dues'), 'EGP ' + totalPayroll.toLocaleString())}
      ${stat('hand-coins', '#f59e0b', t('advances_sum'), 'EGP ' + totalAdvances.toLocaleString())}
      ${stat('minus-circle', '#ef4444', t('deductions_sum'), 'EGP ' + totalDeductions.toLocaleString())}
      ${stat('badge-dollar-sign', '#10b981', t('net_payroll'), 'EGP ' + netPayroll.toLocaleString())}
    </div>

    <div class="grid-2" style="margin-bottom:1.5rem">
      <div class="chart-box">
        <h4><i data-lucide="trending-up"></i> ${t('bookings_by_day')}</h4>

      <div class="chart-box">

/* ---------- EMPLOYEES ---------- */
Pages.employees = function(el){

  el.innerHTML = `

function saveEmployee(id){
  const name = $('#f-name').value.trim();
  if(!name){ showToast(t('required_field'), 'error'); return; }
  const data = {
    code: $('#f-code').value.trim(),
    name,
    phone: $('#f-phone').value.trim(),
    role: $('#f-role').value,
    roles: [$('#f-role').value],
    dayRate: +$('#f-dayRate').value || 0,
    salary: +$('#f-salary').value || 0,
    hireDate: $('#f-hireDate').value,
    status: $('#f-status').value,
    notes: $('#f-notes').value
  };
  if(id){
    const idx = State.data.employees.findIndex(e => e.id === id);
    const old = {...State.data.employees[idx]};
    State.data.employees[idx] = { ...old, ...data };
    logActivity('update','employee',id,old,data);
  } else {
    State.data.employees.push({ id:uid('emp'), ...data });
    logActivity('create','employee',data.code,null,data);
  }
  saveData(); closeModal(); showToast(t('saved'), 'success');
  navigate('employees');
}

function deleteEmployee(id){
  confirmDialog(t('confirm_delete'), () => {
    const idx = State.data.employees.findIndex(e => e.id === id);
    if(idx<0) return;
    const emp = State.data.employees[idx];
    State.data.trash.push({ id:uid('trash'), type:'employee', data:emp, deletedAt:new Date().toISOString(), deletedBy:State.user.name });
    State.data.employees.splice(idx,1);
    logActivity('delete','employee',id,emp,null);
    saveData(); showToast(t('deleted'), 'success'); navigate('employees');
  });
}

function viewEmployee(id){
  const e = State.data.employees.find(x => x.id === id);
  if(!e) return;
  const workDays = (State.data.distributions||[]).filter(x => x.employeeId === id && x.status === 'confirmed').length;
  const advs = (State.data.advances||[]).filter(x => x.employeeId === id);
  const deds = (State.data.deductions||[]).filter(x => x.employeeId === id);
  const bons = (State.data.bonuses||[]).filter(x => x.employeeId === id);
  const totalAdv = advs.reduce((s,x)=>s+(x.remaining||0),0);
  const totalDed = deds.reduce((s,x)=>s+(x.amount||0),0);
  const totalBon = bons.reduce((s,x)=>s+(x.amount||0),0);
  const gross = workDays * (e.dayRate||0);
  const net = gross + totalBon - totalAdv - totalDed;

  openModal({
    title: `${t('employees')} — ${e.name}`,
    size: 'lg',
    body: `
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem">
        <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.5rem">${initials(e.name)}</div>
        <div>
          <h3 style="margin:0;font-size:1.15rem">${e.name}</h3>
          <div style="color:var(--text-muted);font-size:.85rem">${e.role} · ${e.code}</div>
        </div>
      </div>
      <div class="grid-3">
        <div class="card" style="padding:.85rem"><div style="font-size:.7rem;color:var(--text-muted)">${t('work_days')}</div><div style="font-size:1.5rem;font-weight:800">${workDays}</div></div>
        <div class="card" style="padding:.85rem"><div style="font-size:.7rem;color:var(--text-muted)">${t('gross')}</div><div style="font-size:1.5rem;font-weight:800">EGP ${gross.toLocaleString()}</div></div>
        <div class="card" style="padding:.85rem"><div style="font-size:.7rem;color:var(--text-muted)">${t('net')}</div><div style="font-size:1.5rem;font-weight:800;color:#10b981">EGP ${net.toLocaleString()}</div></div>
      </div>
      <h4 style="margin:1rem 0 .5rem;font-size:.9rem">${t('advances')} / ${t('deductions')} / ${t('bonuses')}</h4>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>${t('type')}</th><th>${t('amount')}</th><th>${t('date')}</th><th>${t('reason')}</th></tr></thead>
        <tbody>
          ${advs.map(x=>`<tr><td><span class="badge-pill badge-yellow">${t('advance')}</span></td><td>EGP ${x.amount}</td><td>${fmtDate(x.date)}</td><td>${x.reason||'-'}</td></tr>`).join('')}
          ${deds.map(x=>`<tr><td><span class="badge-pill badge-red">${t('deduction')}</span></td><td>EGP ${x.amount}</td><td>${fmtDate(x.date)}</td><td>${x.reason||'-'}</td></tr>`).join('')}
          ${bons.map(x=>`<tr><td><span class="badge-pill badge-green">${t('bonus')}</span></td><td>EGP ${x.amount}</td><td>${fmtDate(x.date)}</td><td>${x.reason||'-'}</td></tr>`).join('')}

        </tbody>
      </table></div>
    `
  });
}

function saveBooking(id){
  const date = $('#b-date').value;
  const clientName = $('#b-client').value.trim();
  if(!date || !clientName){ showToast(t('required_field'),'error'); return; }
  const data = {
    date, hallId: $('#b-hall').value, clientName,
    phone: $('#b-phone').value.trim(),
    eventType: $('#b-event').value,
    startTime: $('#b-start').value,
    endTime: $('#b-end').value,
    cost: +$('#b-cost').value || 0,
    status: $('#b-status').value,
    paymentStatus: $('#b-payment').value,
    notes: $('#b-notes').value
  };
  if(id){
    const idx = State.data.bookings.findIndex(b => b.id === id);
    State.data.bookings[idx] = { ...State.data.bookings[idx], ...data };
    logActivity('update','booking',id,null,data);
  } else {
    State.data.bookings.push({ id:uid('b'), ...data });
    logActivity('create','booking',clientName,null,data);
    // push notification
    State.data.notifications.unshift({ id:uid('n'), userId:'u1', title:'تم إضافة حجز جديد', body:`${clientName} — ${hallName(data.hallId)}`, date:data.date, read:false, type:'booking' });
  }
  saveData(); closeModal(); showToast(t('saved'),'success'); navigate('bookings');
}

function deleteBooking(id){
  confirmDialog(t('confirm_delete'), () => {
    const b = State.data.bookings.find(x => x.id === id);
    State.data.trash.push({ id:uid('trash'), type:'booking', data:b, deletedAt:new Date().toISOString(), deletedBy:State.user.name });
    State.data.bookings = State.data.bookings.filter(x => x.id !== id);
    logActivity('delete','booking',id,b,null);
    saveData(); showToast(t('deleted'),'success'); navigate('bookings');
  });
}

function importBookings(){
  openModal({
    title: t('import_excel'),
    body: `<p style="font-size:.85rem;color:var(--text-muted)">Upload a CSV/Excel file with columns: date, hall, client, phone, event, start, end, cost</p>
      <div class="field"><input type="file" id="imp-file" accept=".csv,.xlsx,.xls"></div>
      <div id="imp-preview" style="margin-top:1rem"></div>`,
    footer: `<button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>`
  });
  $('#imp-file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = ev.target.result;
      const lines = text.split(/\r?\n/).filter(Boolean);
      const rows = lines.slice(1).map(l => l.split(','));
      const preview = rows.slice(0,5).map(r => `<div style="font-size:.75rem;padding:.35rem;border-bottom:1px solid var(--border)">${r.join(' | ')}</div>`).join('');
      $('#imp-preview').innerHTML = `<h4 style="font-size:.85rem;margin:0 0 .5rem">${t('view')} (${rows.length} rows)</h4>${preview}
        <button class="btn btn-primary btn-sm" style="margin-top:.75rem" onclick="applyImport(${JSON.stringify(rows).replace(/"/g,'&quot;')})">${t('confirm')}</button>`;
    };
    reader.readAsText(f);
  });
}

function applyImport(rows){
  let added = 0;
  rows.forEach(r => {
    if(!r[0] || !r[1]) return;
    const hall = State.data.halls.find(h => h.name.ar === r[1] || h.name.en === r[1] || h.code === r[1]);
    if(!hall) return;
    State.data.bookings.push({
      id:uid('b'), date:r[0], hallId:hall.id, clientName:r[2]||'-', phone:r[3]||'',
      eventType:r[4]||'Wedding', startTime:r[5]||'19:00', endTime:r[6]||'23:00',
      cost:+r[7]||hall.cost, status:'pending', paymentStatus:'unpaid', notes:''
    });
    added++;
  });
  saveData(); closeModal(); showToast(`${added} bookings imported`, 'success'); navigate('bookings');
}

/* ---------- CALENDAR ---------- */
Pages.calendar = function(el){
  const now = new Date();
  const year = State.filters.calYear ?? now.getFullYear();
  const month = State.filters.calMonth ?? now.getMonth();
  State.filters.calYear = year; State.filters.calMonth = month;
  const view = State.filters.calView || 'month';
  const monthName = new Date(year, month, 1).toLocaleDateString(State.lang==='ar'?'ar-EG':'en-GB',{month:'long',year:'numeric'});
  const dayNames = State.lang==='ar' ? ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'] : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();

  const cells = [];
  for(let i=startOffset-1;i>=0;i--) cells.push({ day:prevDays-i, muted:true, date:new Date(year,month-1,prevDays-i) });
  for(let i=1;i<=daysInMonth;i++) cells.push({ day:i, date:new Date(year,month,i) });
  while(cells.length % 7 !== 0 || cells.length < 35) {
    const last = cells[cells.length-1];
    const nd = new Date(last.date); nd.setDate(nd.getDate()+1);
    cells.push({ day:nd.getDate(), muted:true, date:nd });
    if(cells.length >= 42) break;
  }

  const todayStr = todayISO();

  el.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap">
        <button class="btn btn-ghost btn-icon" onclick="calPrev()"><i data-lucide="${State.lang==='ar'?'chevron-right':'chevron-left'}"></i></button>
        <h3 style="margin:0;font-size:1.05rem;font-weight:700;flex:1;text-align:center;min-width:150px">${monthName}</h3>
        <button class="btn btn-ghost btn-icon" onclick="calNext()"><i data-lucide="${State.lang==='ar'?'chevron-left':'chevron-right'}"></i></button>
        <button class="btn btn-ghost btn-sm" onclick="calToday()">${State.lang==='ar'?'اليوم':'Today'}</button>
      </div>
      <div class="cal-head">${dayNames.map(d => `<div>${d}</div>`).join('')}</div>
      <div class="cal-grid">
        ${cells.map(c => {
          const iso = c.date.toISOString().slice(0,10);
          const dayBk = State.data.bookings.filter(b => b.date === iso);
          const isToday = iso === todayStr;
          return `<div class="cal-day ${c.muted?'empty':''} ${isToday?'today':''}" ${!c.muted?`onclick="selectCalDay('${iso}')"`:''}>
            <div class="num">${c.day}</div>
            ${dayBk.length ? `<span class="ev-count">${dayBk.length}</span><div class="events">${dayBk.slice(0,4).map(()=>'<div class="ev-dot"></div>').join('')}</div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
};

function calPrev(){ let m = State.filters.calMonth-1, y = State.filters.calYear; if(m<0){m=11;y--;} State.filters.calMonth=m; State.filters.calYear=y; navigate('calendar'); }
function calNext(){ let m = State.filters.calMonth+1, y = State.filters.calYear; if(m>11){m=0;y++;} State.filters.calMonth=m; State.filters.calYear=y; navigate('calendar'); }
function calToday(){ const n = new Date(); State.filters.calMonth=n.getMonth(); State.filters.calYear=n.getFullYear(); navigate('calendar'); }

function selectCalDay(iso){
  const bookings = State.data.bookings.filter(b => b.date === iso);

      </div>
      ${bookings.length ? bookings.map(b => `

          <div>

      <h4 style="margin:1rem 0 .5rem;font-size:.9rem">${t('distribution')} (${dists.length})</h4>
      ${dists.length ? dists.map(x => `<div style="padding:.4rem 0;font-size:.8rem;border-bottom:1px solid var(--border)">${empName(x.employeeId)} — ${hallName(x.hallId)} · <b>${x.role}</b></div>`).join('') : `<div style="font-size:.8rem;color:var(--text-muted)">${t('no_data')}</div>`}

  const halls = bookedHalls.length ? State.data.halls.filter(h => bookedHalls.includes(h.id)) : State.data.halls.filter(h => h.status === 'active');

  const dists = (State.data.distributions||[]).filter(x => x.date === date);

  el.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;align-items:center">
      <input type="date" id="dist-date" value="${date}" style="padding:.55rem .8rem;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit">

      <button class="btn btn-ghost btn-sm" onclick="window.print()"><i data-lucide="printer"></i> ${t('print_daily')}</button>
      <div style="margin-inline-start:auto;font-size:.8rem;color:var(--text-muted)">
        ${dists.length} ${t('assigned')} · ${halls.length} ${t('halls')}
      </div>
    </div>
    <div style="font-size:.75rem;color:var(--text-muted);margin-bottom:1rem"><i data-lucide="info" style="width:12px;height:12px;display:inline"></i> ${t('drag_hint')}</div>

    ${halls.length ? halls.map(hall => {
      const hallDists = dists.filter(x => x.hallId === hall.id);
      const grouped = {};
      hall.requirements.forEach(r => { grouped[r.role] = { required:r.count, assigned: hallDists.filter(x => x.role === r.role) }; });
      const totalReq = hall.requirements.reduce((s,r)=>s+r.count, 0);
      const totalAssigned = hallDists.length;
      const shortage = totalReq - totalAssigned;

      return `
        <div class="hall-card">
          <div class="hall-header">
            <h4><i data-lucide="building-2" style="width:16px;height:16px;color:var(--primary)"></i> ${hall.name[State.lang]||hall.name.ar} <span style="font-size:.75rem;color:var(--text-muted);font-weight:400">(${hall.code})</span></h4>
            <div style="display:flex;gap:.5rem;align-items:center">
              <span class="badge-pill badge-${shortage<=0?'green':'yellow'}">${totalAssigned}/${totalReq}</span>
            </div>
          </div>
          ${Object.entries(grouped).map(([role, g]) => `
            <div class="role-group">
              <div class="role-label">
                <i data-lucide="${role==='Director'?'clapperboard':role==='Crane'?'camera':'aperture'}" style="width:12px;height:12px"></i>
                ${t(role.toLowerCase())||role} <span class="cnt">${g.assigned.length}/${g.required}</span>
              </div>
              <div class="dropzone" data-hall="${hall.id}" data-role="${role}" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="handleDrop(event,'${hall.id}','${role}')">
                ${g.assigned.map(a => {
                  const emp = State.data.employees.find(e => e.id === a.employeeId);
                  return `<div class="emp-chip" draggable="true" ondragstart="dragStart(event,'${a.id}')" ondragend="this.classList.remove('dragging')" data-dist="${a.id}">
                    <span class="status-dot ${a.status||'confirmed'}"></span>

                  </div>`;

              </div>

let __draggingDistId = null;
function dragStart(e, distId){ __draggingDistId = distId; e.target.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
function handleDrop(e, hallId, role){
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  if(!__draggingDistId) return;
  const dist = State.data.distributions.find(x => x.id === __draggingDistId);
  if(!dist) return;
  // check role match
  const emp = State.data.employees.find(x => x.id === dist.employeeId);
  if(!emp.roles?.includes(role) && emp.role !== role){
    showToast(`${emp.name} cannot be assigned as ${role}`, 'error');
    __draggingDistId = null; return;
  }
  dist.hallId = hallId;
  dist.role = role;
  logActivity('update','distribution',dist.id,null,{hallId, role});
  saveData(); __draggingDistId = null; showToast(t('saved'),'success'); navigate('distribution');
}

function removeDistribution(id){
  State.data.distributions = State.data.distributions.filter(x => x.id !== id);
  logActivity('delete','distribution',id,null,null);
  saveData(); navigate('distribution');
}

function openAssignModal(hallId, role, date){
  // find available employees for this role
  const onLeave = new Set((State.data.leaves||[]).filter(l => l.status==='approved' && l.date === date).map(l => l.employeeId));
  const alreadyAssigned = new Set(State.data.distributions.filter(x => x.date === date).map(x => x.employeeId));
  const eligible = State.data.employees.filter(e =>
    (e.role === role || e.roles?.includes(role)) &&
    e.status === 'active' &&
    !onLeave.has(e.id)
  );
  const available = eligible.filter(e => !alreadyAssigned.has(e.id));
  // Sort by work count
  available.sort((a,b) => {
    const wa = State.data.distributions.filter(x => x.employeeId === a.id).length;
    const wb = State.data.distributions.filter(x => x.employeeId === b.id).length;
    return wa - wb;
  });

  openModal({
    title: `${t('assign')} — ${role}`,
    body: `
      <p style="font-size:.8rem;color:var(--text-muted);margin-top:0">${hallName(hallId)} · ${fmtDate(date)}</p>
      ${available.length ? `<div style="display:flex;flex-direction:column;gap:.5rem">
        ${available.map((e,i) => {
          const count = State.data.distributions.filter(x => x.employeeId === e.id).length;
          return `<button class="btn btn-ghost" style="justify-content:space-between;padding:.75rem" onclick="doAssign('${hallId}','${role}','${date}','${e.id}')">
            <span style="display:flex;align-items:center;gap:.6rem">
              <div class="av" style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700">${initials(e.name)}</div>
              <span><b>${e.name}</b><br><span style="font-size:.7rem;color:var(--text-muted)">${e.role} · ${count} assignments${i===0?' · '+t('suggestion'):''}</span></span>
            </span>
            <i data-lucide="plus"></i>
          </button>`;
        }).join('')}
      </div>` : `<div class="empty-state"><i data-lucide="user-x"></i><p>${t('shortage_msg')}</p></div>`}
      <h4 style="margin:1.25rem 0 .5rem;font-size:.85rem">${t('manual_override')}</h4>
      <div class="field" style="flex-direction:row;gap:.5rem;align-items:center">

function autoDistribute(){
  const date = State.filters.distDate || todayISO();
  const bookings = State.data.bookings.filter(b => b.date === date && b.status !== 'cancelled');
  const bookedHalls = [...new Set(bookings.map(b => b.hallId))];
  const halls = bookedHalls.length ? State.data.halls.filter(h => bookedHalls.includes(h.id)) : State.data.halls.filter(h => h.status==='active');

  const onLeave = new Set((State.data.leaves||[]).filter(l => l.status==='approved' && l.date === date).map(l => l.employeeId));
  const absentToday = new Set((State.data.attendance||[]).filter(a => a.date === date && a.status === 'absent').map(a => a.employeeId));

  // Remove existing distributions for the date
  State.data.distributions = State.data.distributions.filter(x => x.date !== date);

  // Compute totals needed
  const needed = {};
  halls.forEach(h => h.requirements.forEach(r => { needed[r.role] = (needed[r.role]||0) + r.count; }));

  // Build per-role pool with fairness score
  const getScore = (emp) => {
    const totalDist = State.data.distributions.filter(x => x.employeeId === emp.id).length;
    const lastDist = State.data.distributions.filter(x => x.employeeId === emp.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    const lastHall = lastDist?.hallId;
    const consecutiveDays = (() => {
      let c = 0;
      for(let i=1;i<=7;i++){
        const d = addDaysISO(date, -i);
        if(State.data.distributions.some(x => x.employeeId === emp.id && x.date === d)) c++; else break;
      }
      return c;
    })();
    return { totalDist, lastHall, consecutiveDays };
  };

  const assignments = [];
  const usedToday = new Set();

  halls.forEach(hall => {
    hall.requirements.forEach(req => {
      const pool = State.data.employees
        .filter(e => (e.role === req.role || e.roles?.includes(req.role)))
        .filter(e => e.status === 'active')
        .filter(e => !onLeave.has(e.id) && !absentToday.has(e.id))
        .filter(e => !usedToday.has(e.id))
        .map(e => ({ emp:e, score: getScore(e) }))
        .sort((a,b) => {
          if(a.score.totalDist !== b.score.totalDist) return a.score.totalDist - b.score.totalDist;
          if(a.score.consecutiveDays !== b.score.consecutiveDays) return a.score.consecutiveDays - b.score.consecutiveDays;
          // prefer employees whose last hall != current hall
          const aL = a.score.lastHall === hall.id ? 1 : 0;
          const bL = b.score.lastHall === hall.id ? 1 : 0;
          return aL - bL;
        });

      for(let i=0;i<req.count;i++){
        if(pool[i]){
          const chosen = pool[i].emp;
          usedToday.add(chosen.id);
          assignments.push({ id:uid('d'), date, hallId:hall.id, employeeId:chosen.id, role:req.role, status:'confirmed', createdAt:new Date().toISOString(), createdBy:'auto' });
        } else {
          assignments.push({ id:uid('d'), date, hallId:hall.id, employeeId:null, role:req.role, status:'missing', createdAt:new Date().toISOString(), createdBy:'auto' });
        }
      }
    });
  });

  State.data.distributions.push(...assignments);
  logActivity('auto-distribute','distribution',date,null,{count:assignments.length});
  saveData(); showToast(`${assignments.length} assignments created`, 'success'); navigate('distribution');
}

Pages.attendance = function(el){
  const date = State.filters.attDate || todayISO();
  State.filters.attDate = date;
  const records = State.data.employees.map(emp => {
    const rec = (State.data.attendance||[]).find(a => a.employeeId === emp.id && a.date === date);
    return { emp, rec: rec || null };
  });

  el.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;align-items:center">
      <input type="date" id="att-date" value="${date}" style="padding:.55rem .8rem;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit">
      <div style="margin-inline-start:auto;display:flex;gap:.5rem">
        <button class="btn btn-ghost btn-sm" onclick="exportTable('attendance')"><i data-lucide="download"></i> ${t('export')}</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>${t('employees')}</th><th>${t('role')}</th><th>${t('check_in')}</th><th>${t('check_out')}</th><th>${t('status')}</th><th>${t('actions')}</th></tr></thead>
        <tbody>
          ${records.map(({emp,rec}) => `
            <tr>
              <td><div class="cell-user"><div class="av">${initials(emp.name)}</div><div style="font-weight:600">${emp.name}</div></div></td>
              <td>${emp.role}</td>
              <td>${rec?.checkIn || '-'}</td>
              <td>${rec?.checkOut || '-'}</td>
              <td>${rec ? `<span class="badge-pill badge-${statusColor(rec.status)}">${t(rec.status)||rec.status}</span>` : `<span class="badge-pill badge-gray">-</span>`}</td>
              <td>
                <div style="display:flex;gap:.25rem">
                  ${!rec?.checkIn ? `<button class="btn btn-success btn-sm" onclick="doCheckIn('${emp.id}','${date}')"><i data-lucide="log-in" style="width:12px;height:12px"></i> ${t('check_in')}</button>` : ''}
                  ${rec?.checkIn && !rec?.checkOut ? `<button class="btn btn-ghost btn-sm" onclick="doCheckOut('${emp.id}','${date}')"><i data-lucide="log-out" style="width:12px;height:12px"></i> ${t('check_out')}</button>` : ''}
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  $('#att-date')?.addEventListener('change', e => { State.filters.attDate = e.target.value; navigate('attendance'); });
};
function doCheckIn(empId, date){
  const time = new Date().toTimeString().slice(0,5);
  const isLate = time > '10:00';
  State.data.attendance = State.data.attendance || [];
  const existing = State.data.attendance.find(a => a.employeeId===empId && a.date===date);
  if(existing){ existing.checkIn = time; existing.status = isLate?'late':'present'; }
  else State.data.attendance.push({ id:uid('att'), employeeId:empId, date, checkIn:time, checkOut:null, status: isLate?'late':'present' });
  saveData(); showToast(t('saved'),'success'); navigate('attendance');
}
function doCheckOut(empId, date){
  const time = new Date().toTimeString().slice(0,5);
  const rec = State.data.attendance.find(a => a.employeeId===empId && a.date===date);
  if(rec){ rec.checkOut = time; }
  saveData(); showToast(t('saved'),'success'); navigate('attendance');
}

/* ---------- PAYROLL ---------- */
Pages.payroll = function(el){
  const period = State.filters.payPeriod || 'p1';
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  let from, to;
  const settings = State.data.settings.payroll || { p1:{from:1,to:10}, p2:{from:11,to:20}, p3:{from:21,to:31} };
  const cfg = settings[period] || settings.p1;
  from = new Date(y,m,cfg.from).toISOString().slice(0,10);
  to = new Date(y,m+1,0).toISOString().slice(0,10);
  to = new Date(y,m,Math.min(cfg.to, new Date(y,m+1,0).getDate())).toISOString().slice(0,10);

  const rows = State.data.employees.map(e => {
    const dists = State.data.distributions.filter(x => x.employeeId === e.id && x.date >= from && x.date <= to && x.status==='confirmed');
    const workDays = dists.length;
    const gross = workDays * (e.dayRate||0);
    const advs = State.data.advances.filter(a => a.employeeId === e.id && a.date >= from && a.date <= to).reduce((s,a)=>s+(a.amount||0),0);
    const deds = State.data.deductions.filter(d => d.employeeId === e.id && d.date >= from && d.date <= to).reduce((s,a)=>s+(a.amount||0),0);
    const bons = State.data.bonuses.filter(b => b.employeeId === e.id && b.date >= from && b.date <= to).reduce((s,a)=>s+(a.amount||0),0);
    const net = gross + bons - advs - deds;
    return { e, workDays, gross, advs, deds, bons, net };
  });

  el.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem;align-items:center">
      <div class="tabs" style="margin:0;border:none">
        <div class="tab ${period==='p1'?'active':''}" onclick="State.filters.payPeriod='p1';navigate('payroll')">${t('period1')}</div>
        <div class="tab ${period==='p2'?'active':''}" onclick="State.filters.payPeriod='p2';navigate('payroll')">${t('period2')}</div>
        <div class="tab ${period==='p3'?'active':''}" onclick="State.filters.payPeriod='p3';navigate('payroll')">${t('period3')}</div>
      </div>
      <div style="margin-inline-start:auto"><button class="btn btn-ghost btn-sm" onclick="window.print()"><i data-lucide="printer"></i> ${t('print')}</button></div>
    </div>
    <div class="card" style="margin-bottom:1rem;padding:.75rem 1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem">
      <div style="font-size:.85rem"><b>${t('from')}:</b> ${fmtDate(from)} <b style="margin-inline-start:.75rem">${t('to')}:</b> ${fmtDate(to)}</div>
      <div style="font-size:.85rem"><b>${t('total')}:</b> <span style="color:#10b981;font-weight:700">EGP ${rows.reduce((s,r)=>s+r.net,0).toLocaleString()}</span></div>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr>
          <th>${t('name')}</th><th>${t('role')}</th><th>${t('work_days')}</th><th>${t('day_rate')}</th>
          <th>${t('gross')}</th><th>${t('advances')}</th><th>${t('deductions')}</th><th>${t('bonuses')}</th>
          <th>${t('net')}</th><th>${t('actions')}</th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td><div class="cell-user"><div class="av">${initials(r.e.name)}</div><div style="font-weight:600">${r.e.name}</div></div></td>
              <td>${r.e.role}</td>
              <td>${r.workDays}</td>
              <td>EGP ${r.e.dayRate}</td>
              <td>EGP ${r.gross.toLocaleString()}</td>
              <td style="color:#f59e0b">- EGP ${r.advs.toLocaleString()}</td>
              <td style="color:#ef4444">- EGP ${r.deds.toLocaleString()}</td>
              <td style="color:#10b981">+ EGP ${r.bons.toLocaleString()}</td>
              <td><b>EGP ${r.net.toLocaleString()}</b></td>
              <td><button class="btn btn-ghost btn-icon btn-sm" onclick="viewEmployee('${r.e.id}')"><i data-lucide="eye"></i></button></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
};

function openFinanceModal(kind, id){
  const listKey = kind;
  const item = id ? State.data[listKey].find(x => x.id === id) : null;
  const isAdv = kind==='advances';
  openModal({
    title: item ? t('edit') : t('add'),
    body: `
      <div class="field"><label>${t('employees')} *</label>
        <select id="fin-emp">${State.data.employees.map(e => `<option value="${e.id}" ${item?.employeeId===e.id?'selected':''}>${e.name}</option>`).join('')}</select>
      </div>
      <div class="form-row" style="margin-top:.75rem">
        <div class="field"><label>${t('amount')} *</label><input type="number" id="fin-amount" value="${item?.amount||0}" required></div>
        <div class="field"><label>${t('date')}</label><input type="date" id="fin-date" value="${item?.date||todayISO()}"></div>
        ${isAdv ? `<div class="field"><label>${t('installments')}</label><input type="number" id="fin-inst" value="${item?.installments||1}"></div>
        <div class="field"><label>${t('remaining')}</label><input type="number" id="fin-rem" value="${item?.remaining||item?.amount||0}"></div>` : ''}
      </div>
      <div class="field" style="margin-top:.75rem"><label>${t('reason')}</label><textarea id="fin-reason">${item?.reason||''}</textarea></div>
    `,
    footer: `<button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
             <button class="btn btn-primary" onclick="saveFinance('${kind}','${id||''}')">${t('save')}</button>`
  });
}
function saveFinance(kind, id){
  const data = {
    employeeId: $('#fin-emp').value,
    amount: +$('#fin-amount').value || 0,
    date: $('#fin-date').value,
    reason: $('#fin-reason').value
  };
  if(kind==='advances'){
    data.installments = +$('#fin-inst').value || 1;
    data.remaining = +$('#fin-rem').value || data.amount;
    data.status = 'approved';
  }
  if(id){
    const idx = State.data[kind].findIndex(x => x.id === id);
    State.data[kind][idx] = { ...State.data[kind][idx], ...data };
    logActivity('update',kind,id,null,data);
  } else {
    State.data[kind].push({ id:uid(kind[0]), ...data });
    logActivity('create',kind,data.employeeId,null,data);
  }
  saveData(); closeModal(); showToast(t('saved'),'success'); navigate(kind);
}
function deleteFinance(kind, id){
  confirmDialog(t('confirm_delete'), () => {
    const item = State.data[kind].find(x => x.id === id);
    State.data.trash.push({ id:uid('trash'), type:kind, data:item, deletedAt:new Date().toISOString(), deletedBy:State.user.name });
    State.data[kind] = State.data[kind].filter(x => x.id !== id);
    logActivity('delete',kind,id,item,null);
    saveData(); showToast(t('deleted'),'success'); navigate(kind);
  });
}

      const ded = State.data.deductions.filter(a => a.employeeId === e.id).reduce((s,x)=>s+x.amount,0);
      const bon = State.data.bonuses.filter(a => a.employeeId === e.id).reduce((s,x)=>s+x.amount,0);
      const net = c*(e.dayRate||0) + bon - adv - ded;
      return `<tr><td>${e.name}</td><td>${c}</td><td>EGP ${(c*(e.dayRate||0)).toLocaleString()}</td><td>EGP ${adv}</td><td>EGP ${ded}</td><td>EGP ${bon}</td><td><b>EGP ${net.toLocaleString()}</b></td></tr>`;

    </tbody></table></div>`;
  } else if(id === 'distribution'){

    </tbody></table></div>`;
  } else if(id === 'financial'){

    </div>`;
  }
  openModal({

function editUser(id){
  const u = id ? State.data.users.find(x => x.id === id) : null;
  openModal({
    title: u ? t('edit') : t('add_user'),
    body: `
      <div class="form-row">
        <div class="field"><label>${t('username')} *</label><input id="u-username" value="${u?.username||''}"></div>
        <div class="field"><label>${t('name')} *</label><input id="u-name" value="${u?.name||''}"></div>
        <div class="field"><label>${t('password')} ${u?'':'*'}</label><input id="u-password" type="password" value="${u?.password||''}"></div>
        <div class="field"><label>${t('role')}</label>
          <select id="u-role">${State.data.roles.map(r => `<option ${u?.role===r.name?'selected':''}>${r.name}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Linked Employee</label>
          <select id="u-emp"><option value="">-</option>${State.data.employees.map(e => `<option value="${e.id}" ${u?.employeeId===e.id?'selected':''}>${e.name}</option>`).join('')}</select>
        </div>
      </div>
    `,
    footer: `<button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
             <button class="btn btn-primary" onclick="saveUser('${id||''}')">${t('save')}</button>`
  });
}
function saveUser(id){
  const data = {
    username: $('#u-username').value.trim(),
    name: $('#u-name').value.trim(),
    password: $('#u-password').value,
    role: $('#u-role').value,
    employeeId: $('#u-emp').value || null
  };
  if(!data.username || !data.password || !data.name){ showToast(t('required_field'),'error'); return; }
  if(id){
    const idx = State.data.users.findIndex(x => x.id === id);
    State.data.users[idx] = { ...State.data.users[idx], ...data };
  } else {
    if(State.data.users.find(x => x.username === data.username)){ showToast('Username exists','error'); return; }
    State.data.users.push({ id:uid('u'), ...data });
  }
  saveData(); closeModal(); showToast(t('saved'),'success'); navigate('users');
}
function deleteUser(id){
  confirmDialog(t('confirm_delete'), () => {
    State.data.users = State.data.users.filter(x => x.id !== id);
    saveData(); showToast(t('deleted'),'success'); navigate('users');
  });
}
function editRole(id){
  const r = State.data.roles.find(x => x.id === id);
  const modules = ['dashboard','employees','halls','bookings','calendar','distribution','attendance','payroll','advances','deductions','bonuses','clients','equipment','reports','users','settings','activity','trash'];
  const perms = ['view','create','edit','delete','export','print','approve'];
  openModal({
    title: `${t('role')}: ${r.name}`,
    size: 'xl',
    body: `
      <div class="table-wrap"><table class="data-table" style="font-size:.78rem">
        <thead><tr><th>${t('module')}</th>${perms.map(p => `<th>${t(p+'_perm')||p}</th>`).join('')}</tr></thead>
        <tbody>
          ${modules.map(m => `<tr>
            <td><b>${t(m)}</b></td>
            ${perms.map(p => {
              const cur = r.permissions[m] || [];
              const checked = cur.includes(p) || r.permissions['*'];
              return `<td><input type="checkbox" data-role-module="${m}" data-role-perm="${p}" ${checked?'checked':''} style="accent-color:var(--primary)"></td>`;
            }).join('')}
          </tr>`).join('')}
        </tbody>
      </table></div>
    `,
    footer: `<button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
             <button class="btn btn-primary" onclick="saveRole('${id}')">${t('save')}</button>`
  });
}
function saveRole(id){
  const r = State.data.roles.find(x => x.id === id);
  const next = {};
  $$('[data-role-module]').forEach(cb => {
    if(!cb.checked) return;
    const m = cb.dataset.roleModule;
    const p = cb.dataset.rolePerm;
    next[m] = next[m] || [];
    next[m].push(p);
  });
  r.permissions = next;
  saveData(); closeModal(); showToast(t('saved'),'success'); navigate('users');
}

function restoreTrash(id){
  const item = State.data.trash.find(x => x.id === id);
  if(!item) return;
  const listMap = { employee:'employees', hall:'halls', booking:'bookings', advances:'advances', deductions:'deductions', bonuses:'bonuses' };
  const key = listMap[item.type];
  if(key && State.data[key]) State.data[key].push(item.data);
  State.data.trash = State.data.trash.filter(x => x.id !== id);
  saveData(); showToast(t('restore')+' ✓','success'); navigate('trash');
}
function permanentDelete(id){
  State.data.trash = State.data.trash.filter(x => x.id !== id);
  saveData(); showToast(t('deleted'),'success'); navigate('trash');
}

function saveSettings(){

  s.notifications.enabled = $('#s-notif').checked;
  s.notifications.whatsapp = $('#s-wa').checked;
  s.notifications.whatsappApi = $('#s-wa-api').value;
  s.distribution.fairRotation = $('#s-fair').checked;
  s.distribution.preventSameHallConsecutive = $('#s-prevent').checked;
  s.security.passwordMin = +$('#s-pwd-min').value || 6;
  s.security.sessionTimeout = +$('#s-session').value || 60;
  $$('[data-role-price]').forEach(inp => { s.rolePrices[inp.dataset.rolePrice] = +inp.value || 0; });

  const newLang = $('#s-lang').value;
  const newTheme = $('#s-theme').value;
  if(newLang !== State.lang){ State.lang = newLang; localStorage.setItem(LANG_KEY, newLang); }
  if(newTheme !== State.theme){ State.theme = newTheme; localStorage.setItem(THEME_KEY, newTheme); applyTheme(); }

  saveData();
  showToast(t('saved'),'success');
  applyLang();
  renderSidebar();
  navigate('settings');
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(State.data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `drmedia-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded','success');
}
function importBackup(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = (e) => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if(!data.users || !data.employees){ throw new Error('Invalid backup'); }
        State.data = data;
        saveData(); showToast(t('saved'),'success'); navigate('settings');
      } catch(err){ showToast('Invalid backup file','error'); }
    };
    reader.readAsText(f);
  };
  inp.click();
}
function resetDemo(){
  confirmDialog('Reset all data to demo? This cannot be undone!', () => {
    localStorage.removeItem(STORAGE_KEY);
    State.data = loadData();
    showToast('Demo data restored','success');
    navigate('dashboard');
  });
}

/* ---------- Global Search ---------- */
function performGlobalSearch(q){
  if(!q || q.length < 2) return;
  const results = [];
  const lq = q.toLowerCase();
  State.data.employees.forEach(e => { if(e.name.toLowerCase().includes(lq)) results.push({type:'Employee', icon:'user', text:e.name, action:`viewEmployee('${e.id}')`}); });
  State.data.bookings.forEach(b => { if((b.clientName||'').toLowerCase().includes(lq)) results.push({type:'Booking', icon:'calendar', text:`${b.clientName} — ${fmtDate(b.date)}`, action:`editBooking('${b.id}')`}); });
  State.data.clients.forEach(c => { if(c.name.toLowerCase().includes(lq)) results.push({type:'Client', icon:'user-circle', text:c.name, action:`editClient('${c.id}')`}); });
  State.data.halls.forEach(h => { if((h.name.ar+h.name.en).toLowerCase().includes(lq)) results.push({type:'Hall', icon:'building-2', text:h.name[State.lang]||h.name.ar, action:`editHall('${h.id}')`}); });
  State.data.equipment.forEach(e => { if(e.name.toLowerCase().includes(lq)) results.push({type:'Equipment', icon:'camera', text:e.name, action:`editEquipment('${e.id}')`}); });

  openModal({
    title: `🔍 ${t('search')}: "${q}"`,
    body: results.length ? `<div style="display:flex;flex-direction:column;gap:.35rem">
      ${results.slice(0,20).map(r => `<button class="btn btn-ghost" style="justify-content:flex-start;gap:.65rem" onclick="closeModal();${r.action}">
        <i data-lucide="${r.icon}" style="color:var(--primary)"></i>
        <span><b>${r.text}</b><br><span style="font-size:.7rem;color:var(--text-muted)">${r.type}</span></span>
      </button>`).join('')}
    </div>` : `<div class="empty-state"><i data-lucide="search-x"></i><p>${t('no_data')}</p></div>`
  });
}

/* ---------- Export ---------- */
function exportTable(module){
  let rows = [], headers = [];
  if(module === 'employees'){
    headers = ['ID','Name','Role','Phone','Day Rate','Hire Date','Status'];
    rows = State.data.employees.map(e => [e.code, e.name, e.role, e.phone, e.dayRate, e.hireDate, e.status]);
  } else if(module === 'bookings'){
    headers = ['ID','Date','Hall','Client','Event','Start','End','Cost','Status'];
    rows = State.data.bookings.map(b => [b.id, b.date, hallName(b.hallId), b.clientName, b.eventType, b.startTime, b.endTime, b.cost, b.status]);
  } else if(module === 'attendance'){
    headers = ['Employee','Date','CheckIn','CheckOut','Status'];
    rows = (State.data.attendance||[]).map(a => [empName(a.employeeId), a.date, a.checkIn, a.checkOut, a.status]);
  }
  const csv = [headers, ...rows].map(r => r.map(x => `"${x||''}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = module+'-export-'+todayISO()+'.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('Exported', 'success');
}
function exportCSV(id){ exportTable(id === 'bookings' ? 'bookings' : 'employees'); }

/* =========================================================
   APP BOOT
   ========================================================= */
function boot(){
  State.data = loadData();
  applyTheme();
  applyLang();

  // Login handler
  $('#login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const u = $('#login-user').value.trim();
    const p = $('#login-pass').value;
    if(attemptLogin(u, p)){
      showToast(t('login_success'),'success');
      startApp();
    } else {
      showToast(t('login_error'),'error');
    }
  });
  $('#toggle-pass').addEventListener('click', () => {
    const inp = $('#login-pass');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    $('#toggle-pass').innerHTML = `<i data-lucide="${inp.type==='password'?'eye':'eye-off'}"></i>`;
    lucide.createIcons();
  });

  // Topbar
  $('#menu-btn')?.addEventListener('click', openSidebar);
  $('#sidebar-overlay')?.addEventListener('click', closeSidebar);
  $('#logout-btn')?.addEventListener('click', () => { confirmDialog(t('logout')+'?', logout); });
  $('#lang-btn')?.addEventListener('click', () => {
    State.lang = State.lang === 'ar' ? 'en' : 'ar';
    localStorage.setItem(LANG_KEY, State.lang);
    applyLang(); renderSidebar(); navigate(State.page);
  });
  $('#theme-btn')?.addEventListener('click', () => {
    State.theme = State.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, State.theme);
    applyTheme(); navigate(State.page);
  });
  $('#notif-btn')?.addEventListener('click', () => navigate('notifications'));

  let searchT;
  $('#global-search')?.addEventListener('input', (e) => {
    clearTimeout(searchT);
    const q = e.target.value;
    searchT = setTimeout(() => performGlobalSearch(q), 400);
  });

  lucide.createIcons();

  // Auto-login if session
  if(restoreSession()){
    startApp();
  }
}

function startApp(){
  $('#login-screen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#user-avatar').textContent = initials(State.user.name);
  $('#user-name').textContent = State.user.name;
  $('#user-role').textContent = State.user.role;
  renderSidebar();
  updateNotifBadge();
  applyLang();
  navigate('dashboard');
}

document.addEventListener('DOMContentLoaded', boot);
</script>
